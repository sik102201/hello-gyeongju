
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELLO GYEONGJU | 경주 관광 가이드</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .eyebrow {
      letter-spacing: 5px;
      color: #e2c48c;
      font-size: 13px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 8vw, 90px);
      margin: 25px 0;
      letter-spacing: 3px;
    }

    p {
      max-width: 650px;
      line-height: 1.8;
      color: #e5e5e5;
    }

    .languages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 35px;
    }

    .languages span {
      padding: 14px 20px;
      border: 1px solid #ffffff75;
      border-radius: 7px;
    }

    footer {
      margin-top: 60px;
      font-size: 13px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DISCOVER GYEONGJU</div>

    <h1>HELLO<br>GYEONGJU</h1>

    <p>
      천년의 역사와 문화가 살아 숨 쉬는 도시, 경주.
      HELLO GYEONGJU는 전 세계 여행자를 위한
      다국어 경주 관광정보 플랫폼입니다.
    </p>

    <div class="languages">
      <span>한국어</span>
      <span>English</span>
      <span>日本語</span>
      <span>中文</span>
    </div>

    <footer>
      University Graduation Project<br>
      Currently in Development
    </footer>
  </main>
</body>
</html>
